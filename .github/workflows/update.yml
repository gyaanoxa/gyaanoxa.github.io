name: Update videos from YouTube

on:
  schedule:
    - cron: "17 */3 * * *"      # every 3 hours
    - cron: "40 7,12,13 * * *"  # right after the 1 PM, 6 PM and 7 PM IST releases
  workflow_dispatch:            # "Run workflow" button
  push:
    paths: ["data/site.json", "build/**"]

permissions:
  contents: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pillow==11.0.0
      - run: python build/build.py
      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update videos from YouTube"
          for i in 1 2 3 4; do
            git push && exit 0
            echo "push failed, retry $i"; sleep $((i * 15))
            git fetch origin main && git reset --hard origin/main   # someone else pushed: start from the newest site
            python build/build.py
            git add -A
            git diff --cached --quiet && exit 0
            git commit -m "Update videos from YouTube"
          done
          exit 1
